name: POS runtime regression
on:
  workflow_dispatch:
  push:
    branches: [main, fix/pos-runtime-consistency]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zaabos_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: zaabos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zaabos_ci -d zaabos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZAABOS_SECRET_KEY: isolated-regression-session-key
      ZAABOS_ADMIN_PASSWORD: isolated-regression-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-local.txt pytest
      - name: SQLite and browser regressions
        run: |
          python -m pytest tests/test_runtime_regressions.py tests/test_money_reconciliation.py tests/test_local_mode.py tests/test_printing.py tests/test_local_ops.py tests/test_version_e_api.py tests/test_batch_a.py -q
          python -m pytest tests/soak_shop_day.py -q -W error::pytest.PytestUnhandledThreadExceptionWarning
          python round30_customer_history_test.py
          python round31_table_open_bill_test.py
          node tests/customer_history_runtime.test.cjs
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - name: PostgreSQL concurrent checkout and real restore
        env:
          DATABASE_URL: postgresql://zaabos_ci:disposable-ci-only@127.0.0.1:5432/zaabos_ci
        run: python -m pytest tests/test_runtime_regressions.py tests/test_money_reconciliation.py tests/test_printing.py tests/test_version_e_api.py tests/test_batch_a.py -q
