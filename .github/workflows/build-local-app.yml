name: Build ZaabOS Local (Windows + macOS)
on:
  push:
    branches: [step2-local-shop-pos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.txt pytest pyinstaller pillow
      - name: Shop-PC end-to-end (sell, restart, data kept, backup)
        run: python -m pytest tests/test_local_mode.py tests/test_money_reconciliation.py -q
      - run: pyinstaller zaabos_local.spec --noconfirm
      - name: Smoke-test the packaged app
        run: |
          BIN=dist/ZaabOS/ZaabOS; [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --no-browser --port 18765 --data-dir "$RUNNER_TEMP/zaabos-data" > smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18765/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18765/healthz
          curl -sf http://127.0.0.1:18765/ | grep -q '<title>ZaabOS'
          test -f "$RUNNER_TEMP/zaabos-data/zaabos.db"
          ls "$RUNNER_TEMP/zaabos-data/backups" | grep -q zaabos_local_
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ZaabOS-Local-${{ runner.os }}
          path: ${{ runner.os == 'macOS' && 'dist/ZaabOS.app' || 'dist/ZaabOS' }}
          retention-days: 30
