name: Build Batch B update for existing test Mac app
on:
  push:
    branches: [trial/batch-b-2.8.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zaabos-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-local.txt pytest
      - name: POS regressions for the existing local app
        env:
          ZAABOS_DATA_DIR: ${{ runner.temp }}/regression-data
          ZAABOS_SECRET_KEY: disposable-trial-ci-key
          ZAABOS_ADMIN_PASSWORD: disposable-trial-ci-password
        run: |
          python -m pytest tests/test_runtime_regressions.py tests/test_money_reconciliation.py tests/test_local_mode.py tests/test_printing.py tests/test_local_ops.py tests/test_version_e_api.py tests/test_batch_a.py tests/test_batch_b.py -q
          node tests/customer_history_runtime.test.cjs
  build:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.txt pyinstaller rumps
      - name: Verify architecture and build existing app identity
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python -c 'import os,platform; assert platform.machine() == os.environ["EXPECTED_ARCH"]'
          pyinstaller zaabos_local.spec --noconfirm
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' 'dist/ZaabOS.app/Contents/Info.plist' | grep -x com.zaabos.local
      - name: Package app with Thai instructions
        env:
          ZIP_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p package/ZaabOS-B-Update
          ditto 'dist/ZaabOS.app' 'package/ZaabOS-B-Update/ZaabOS.app'
          cp TRIAL_README_TH.md package/ZaabOS-B-Update/READ_ME_TH.md
          ditto -c -k --keepParent package/ZaabOS-B-Update "ZaabOS-B-Update-macOS-${ZIP_LABEL}.zip"
          shasum -a 256 "ZaabOS-B-Update-macOS-${ZIP_LABEL}.zip" > "ZaabOS-B-Update-macOS-${ZIP_LABEL}.sha256"
      - name: Launch the extracted update with disposable test data
        env:
          ZIP_LABEL: ${{ matrix.label }}
        run: |
          mkdir unpack-check
          ditto -x -k "ZaabOS-B-Update-macOS-${ZIP_LABEL}.zip" unpack-check
          'unpack-check/ZaabOS-B-Update/ZaabOS.app/Contents/MacOS/ZaabOS' --no-browser --port 18765 --data-dir "$RUNNER_TEMP/trial-smoke" > smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill "$SMOKE_PID" 2>/dev/null || true; cat smoke.log' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18765/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18765/readyz
          curl -fsS http://127.0.0.1:18765/ > "$RUNNER_TEMP/trial-home.html"
          grep -q '<title>ZaabOS' "$RUNNER_TEMP/trial-home.html"
          test -f "$RUNNER_TEMP/trial-smoke/zaabos.db"
          test -f "$RUNNER_TEMP/trial-smoke/first-login.txt"
          test ! -e "$HOME/Library/Application Support/ZaabOS/zaabos.db"
          test ! -e "$HOME/Library/LaunchAgents/com.zaabos.local.plist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZaabOS-B-Update-macOS-${{ matrix.label }}
          path: |
            ZaabOS-B-Update-macOS-${{ matrix.label }}.zip
            ZaabOS-B-Update-macOS-${{ matrix.label }}.sha256
          if-no-files-found: error
          retention-days: 30
