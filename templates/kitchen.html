<!doctype html><html lang="th" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>หน้าจอครัว — ZaabOS</title>
<link rel="icon" href="/favicon.ico?v=8" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v=8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8">
<link rel="manifest" href="/static/manifest.webmanifest?v=8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/static/style.css?v=30.0"><link rel="stylesheet" href="/static/icons.css?v=1"><link rel="stylesheet" href="/static/theme.css?v=2">
<meta name="theme-color" content="#ea580c">
</head><body>

<section id="loginView" class="login-screen hidden">
  <select id="loginLangSelect" class="lang-select lang-select-login"></select>
  <form id="loginForm" class="login-card">
    <div class="brand center">Zaab<b>OS</b> <i class="ic ic-chef-hat" aria-hidden="true"></i></div>
    <p class="login-sub" data-i18n="kitchen_login_sub">เข้าสู่ระบบพนักงานเพื่อดูคิวออเดอร์ครัว</p>
    <label><span data-i18n="login_username">ชื่อผู้ใช้</span><input id="loginUsername" autocomplete="username" required></label>
    <label><span data-i18n="login_password">รหัสผ่าน</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <div class="login-error" id="loginError"></div>
    <button class="save" type="submit" data-i18n="login_submit">เข้าสู่ระบบ</button>
  </form>
</section>

<div id="kitchenBootView" class="kitchen-boot"><div class="kitchen-boot-card"><div class="brand center">Zaab<b>OS</b></div><div class="kitchen-boot-dot"></div></div></div>

<div id="boardView" class="hidden">
  <header>
    <div class="brand">Zaab<b>OS</b> <span data-i18n="kitchen_header_title"><i class="ic ic-chef-hat" aria-hidden="true"></i> หน้าจอครัว</span></div>
    <div class="head-right">
      <select id="langSelect" class="lang-select"></select>
      <select id="branchSelect"></select>
      <select id="kitchenStationFilter" aria-label="สถานีครัว"><option value="">ทุกสถานี</option></select>
      <button class="ghost-btn" id="refreshBtn"><i class="ic ic-refresh-cw" aria-hidden="true"></i></button>
      <a class="ghost-btn kitchen-home-link" href="/" style="text-decoration:none"><i class="ic ic-arrow-left" aria-hidden="true"></i> POS / หน้าร้าน</a>
    </div>
  </header>
  <main style="max-width:1400px">
    <div class="kitchen-board" id="board"></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script>const DEFAULT_LANG = 'th';</script>
<script src="/static/i18n.js?v=30.2"></script>
<script src="/static/kitchen.js?v=30.2"></script>
</body></html>
