<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ออฟไลน์ · ZaabOS</title><meta name="theme-color" content="#17151d"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/static/style.css"></head><body class="system-page"><main class="system-card"><div class="system-brand">Zaab<b>OS</b></div><div class="offline-orb">↯</div><h1>ขณะนี้ออฟไลน์</h1><p>อุปกรณ์นี้ติดต่อ ZaabOS Server ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองเชื่อมต่ออีกครั้ง</p><div class="offline-status"><span id="offlineDot"></span><span id="offlineText">กำลังรอการเชื่อมต่อ…</span></div><button class="save system-action" onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button><small>Offline POS เต็มรูปแบบจะเปิดใช้ในขั้น Sync ถัดไป เพื่อป้องกันบิลหรือยอดชำระซ้ำ</small></main><script>function state(){const on=navigator.onLine;document.getElementById('offlineText').textContent=on?'อินเทอร์เน็ตกลับมาแล้ว — กำลังเชื่อมต่อ':'ยังไม่มีการเชื่อมต่อ';document.getElementById('offlineDot').className=on?'online':'';if(on)setTimeout(()=>location.href='/',700)}addEventListener('online',state);addEventListener('offline',state);state();</script></body></html>
